# Compila a app Universal para o Mac (Intel + Apple Silicon).
# Em cada alteração ao main, publica-a também num Release, para descarga livre.
name: App para o Mac

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (Intel + Apple Silicon)
        run: mac/compilar.sh
      - name: Confirmar que é Universal
        run: |
          lipo -archs dist/Mindmap.app/Contents/MacOS/Mindmap | grep -q x86_64
          lipo -archs dist/Mindmap.app/Contents/MacOS/Mindmap | grep -q arm64
          codesign --verify --deep --strict dist/Mindmap.app
      - uses: actions/upload-artifact@v4
        with:
          name: Mindmap-Mac-Universal
          path: dist/Mindmap-Mac-Universal.zip
          if-no-files-found: error

  # Só no main: põe o zip num Release com o número da versão da app.
  # O link fixo é .../releases/latest/download/Mindmap-Mac-Universal.zip
  publicar:
    needs: compilar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mindmap-Mac-Universal
          path: dist
      - name: Publicar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO=$(sed -n "s/^const APP_VERSAO = '\(.*\)';.*/\1/p" index.html)
          test -n "$VERSAO"
          TAG="v$VERSAO"
          {
            python3 -c "import json; print(json.load(open('versao.json')).get('notas', ''))"
            echo
            echo "**Para instalar:** descarrega o \`Mindmap-Mac-Universal.zip\`, abre-o e arrasta o Mindmap para as Aplicações. Na primeira vez, abre-o com o botão direito › *Abrir*."
            echo
            echo "Corre em Macs Intel e Apple Silicon, com o macOS 11.3 ou mais recente. Quem já tem a app não precisa de a descarregar outra vez: ela atualiza-se a partir dela própria."
          } > notas.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/Mindmap-Mac-Universal.zip --clobber
            gh release edit "$TAG" --notes-file notas.md --latest
          else
            gh release create "$TAG" dist/Mindmap-Mac-Universal.zip --title "Mindmap $VERSAO" --notes-file notas.md --target "$GITHUB_SHA" --latest
          fi
